name: Build and Push Container Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker.yml'
      - 'snake.html'
      - 'dino.html'
      - 'tetris.html'
      - 'entrypoint.sh'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage container build context
        run: |
          cat > Dockerfile.cloudrun << 'EOF'
          FROM ghcr.io/taeold/djev-run:latest
          COPY snake.html dino.html tetris.html /opt/dgemma/
          COPY entrypoint.sh /entrypoint.sh
          RUN chmod +x /entrypoint.sh
          EXPOSE 8080
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ghcr.io/taeold/djev-run:latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cloudrun
          platforms: linux/amd64
          push: true
          tags: ghcr.io/taeold/djev-run:latest
