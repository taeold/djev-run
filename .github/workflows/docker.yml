name: Build and Push Container Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker.yml'
      - 'snake.html'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Clone mmastrac/djev-spark and adapt for Cloud Run
        run: |
          git clone --depth=1 https://github.com/mmastrac/djev-spark.git djev-spark
          cp snake.html djev-spark/server/snake.html
          python3 -c '
          import pathlib
          p = pathlib.Path("djev-spark/server/structured_server.py")
          s = p.read_text()
          s = s.replace(
              "TEST_PAGE = os.environ.get(\"TEST_PAGE\", \"\") == \"1\"",
              "TEST_PAGE = os.environ.get(\"TEST_PAGE\", \"1\") == \"1\""
          )
          s = s.replace(
              "\"/\": \"playground.html\",",
              "\"/\": \"snake.html\",\n    \"/snake\": \"snake.html\",\n    \"/snake.html\": \"snake.html\","
          )
          s = s.replace(
              "        if self.path == \"/health\":\n            return self._json(200, {\"status\": \"ok\"})",
              "        if self.path == \"/health\":\n"
              "            try:\n"
              "                urllib.request.urlopen(ARGS.upstream + \"/health\", timeout=1)\n"
              "                return self._json(200, {\"status\": \"ok\"})\n"
              "            except Exception:\n"
              "                return self._json(503, {\"status\": \"starting\"})"
          )
          s = s.replace(
              "init_tokenizer(AutoTokenizer.from_pretrained(ARGS.tokenizer))",
              "tok = AutoTokenizer.from_pretrained(ARGS.tokenizer)\n"
              "    if tok.chat_template is None and os.path.exists(os.path.join(ARGS.tokenizer, \"chat_template.jinja\")):\n"
              "        tok.chat_template = open(os.path.join(ARGS.tokenizer, \"chat_template.jinja\")).read()\n"
              "    init_tokenizer(tok)"
          )
          p.write_text(s)
          '
          cat > djev-spark/entrypoint.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          MODEL="${MODEL:-/mnt/gcs/dgemma}"
          CANVAS="${CANVAS:-128}"
          PORT="${PORT:-8080}"
          ENFORCE_EAGER="${ENFORCE_EAGER:-1}"
          DISABLE_MM="${DISABLE_MM:-1}"
          export VLLM_WORKER_MULTIPROC_METHOD="${VLLM_WORKER_MULTIPROC_METHOD:-fork}"
          EXTRA_ARGS="${EXTRA_ARGS:-}"
          JIT_CACHE_ARCHIVE="/mnt/gcs/jit-cache/rtx-pro-6000-cache.tar.gz"
          mkdir -p /root/.cache/flashinfer /root/.triton /root/.cache/vllm
          if [ -f "$JIT_CACHE_ARCHIVE" ]; then
            tar -xzf "$JIT_CACHE_ARCHIVE" -C /root/ || true
          fi
          if [ "${COPY_TO_SHM:-1}" = "1" ] && [ -d "/mnt/gcs/dgemma" ] && [ -f "/mnt/gcs/dgemma/config.json" ]; then
            mkdir -p /dev/shm/dgemma
            find /mnt/gcs/dgemma -maxdepth 1 -type f ! -name "*.safetensors" | xargs -I {} cp -f {} /dev/shm/dgemma/
            (
              find /mnt/gcs/dgemma -maxdepth 1 -type f -name "*.safetensors" | xargs -P 16 -I {} cp -f {} /dev/shm/dgemma/
              touch /dev/shm/dgemma/.ready
              echo "[init] Background safetensors copy to /dev/shm/dgemma complete"
            ) &
            MODEL="/dev/shm/dgemma"
          fi
          python3 /opt/dgemma/structured_server.py --upstream http://127.0.0.1:8000 --model dgemma --tokenizer "$MODEL" --canvas "$CANVAS" --host 0.0.0.0 --port "$PORT" &
          VLLM_EXTRA_ARGS=()
          if [ "$ENFORCE_EAGER" = "1" ]; then
            export TORCH_COMPILE_DISABLE="${TORCH_COMPILE_DISABLE:-1}"
            VLLM_EXTRA_ARGS+=(--enforce-eager --kernel-config '{"enable_flashinfer_autotune":false,"enable_cutedsl_warmup":false,"enable_jit_warmup":false}')
          fi
          if [ "$DISABLE_MM" = "1" ]; then
            VLLM_EXTRA_ARGS+=(--language-model-only --skip-mm-profiling --limit-mm-per-prompt '{"image":0,"video":0}')
          fi
          if [ -n "$EXTRA_ARGS" ]; then
            VLLM_EXTRA_ARGS+=($EXTRA_ARGS)
          fi
          exec vllm serve "$MODEL" --host 127.0.0.1 --port 8000 --served-model-name dgemma --trust-remote-code \
            --max-num-seqs "${MAX_SEQS:-32}" --max-model-len "${MAX_MODEL_LEN:-4096}" \
            --attention-backend "${ATTN:-TRITON_ATTN}" --gpu-memory-utilization "${GPU_UTIL:-0.40}" \
            --kv-cache-memory "$(( ${KV_CACHE_GB:-2} * 1073741824 ))" --max-logprobs 32 --enable-prefix-caching \
            --diffusion-config "{\"canvas_length\": ${CANVAS}}" --override-generation-config '{"max_new_tokens": null}' \
            --async-scheduling "${VLLM_EXTRA_ARGS[@]}"
          EOF
          cat > djev-spark/Dockerfile.cloudrun << 'EOF'
          FROM ghcr.io/taeold/djev-run:latest
          RUN python3 -c '
          import pathlib
          p = pathlib.Path("/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu_worker.py")
          s = p.read_text()
          s = s.replace(
              "        if kv_cache_memory_bytes := self.cache_config.kv_cache_memory_bytes:\n"
              "            # still need a profile run which compiles the model for\n"
              "            # max_num_batched_tokens\n"
              "            self.model_runner.profile_run()",
              "        if kv_cache_memory_bytes := self.cache_config.kv_cache_memory_bytes:\n"
              "            if not self.model_config.enforce_eager:\n"
              "                self.model_runner.profile_run()"
          )
          s = s.replace(
              "        kernel_warmup(self)\n\n"
              "        if self.use_v2_model_runner:\n"
              "            # A workspace resize after capture frees what the graphs point at.\n"
              "            warmup_kernels(self.model_runner, self.execute_model, self.sample_tokens)",
              "        if not self.model_config.enforce_eager:\n"
              "            kernel_warmup(self)\n"
              "            if self.use_v2_model_runner:\n"
              "                warmup_kernels(self.model_runner, self.execute_model, self.sample_tokens)"
          )
          s = s.replace(
              "self.model_runner.load_model(load_dummy_weights=load_dummy_weights)",
              "import os, time\n"
              "            while os.path.exists(\"/dev/shm/dgemma\") and not os.path.exists(\"/dev/shm/dgemma/.ready\"): time.sleep(0.05)\n"
              "            self.model_runner.load_model(load_dummy_weights=load_dummy_weights)"
          )
          p.write_text(s)
          '
          COPY server/structured_server.py server/snake.html server/playground.html server/walk.html server/cube.html server/test_structured_server.py /opt/dgemma/
          COPY entrypoint.sh /entrypoint.sh
          RUN chmod +x /entrypoint.sh && python3 -m py_compile /opt/dgemma/structured_server.py
          EXPOSE 8080
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ghcr.io/taeold/djev-run:latest
        uses: docker/build-push-action@v6
        with:
          context: ./djev-spark
          file: ./djev-spark/Dockerfile.cloudrun
          platforms: linux/amd64
          push: true
          tags: ghcr.io/taeold/djev-run:latest
