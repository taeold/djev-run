name: Build and Push Container Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker.yml'
      - 'snake.html'
      - 'dino.html'
      - 'tetris.html'
      - 'vision.html'
      - 'ultra_fast_entrypoint.sh'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Clone mmastrac/djev-spark, mmastrac/djev (span-answer-type), and vLLM PR #58216 + #58226 overlay
        run: |
          git clone --depth=1 https://github.com/mmastrac/djev-spark.git djev-spark
          git clone https://github.com/mmastrac/djev.git mmastrac-djev
          git -C mmastrac-djev checkout 11cb7c87b0b92a89e22f1e51002733bbf906b159
          cp mmastrac-djev/structured_server.py djev-spark/server/structured_server.py
          cp snake.html djev-spark/server/snake.html
          cp dino.html djev-spark/server/dino.html
          if [ -f tetris.html ]; then cp tetris.html djev-spark/server/tetris.html; fi
          if [ -f vision.html ]; then cp vision.html djev-spark/server/vision.html; fi
          cp ultra_fast_entrypoint.sh djev-spark/entrypoint.sh
          cat > patch_server.py << 'EOF'
          import pathlib
          p = pathlib.Path("djev-spark/server/structured_server.py")
          s = p.read_text()
          s = s.replace(
              "TOK = None",
              "TOK = None\n"
              "TEST_PAGE = os.environ.get(\"TEST_PAGE\", \"\") == \"1\"\n"
              "PAGES = {\n"
              "    \"/\": \"snake.html\",\n"
              "    \"/snake\": \"snake.html\",\n"
              "    \"/snake.html\": \"snake.html\",\n"
              "    \"/dino\": \"dino.html\",\n"
              "    \"/dino.html\": \"dino.html\",\n"
              "    \"/tetris\": \"tetris.html\",\n"
              "    \"/tetris.html\": \"tetris.html\",\n"
              "    \"/vision\": \"vision.html\",\n"
              "    \"/vision.html\": \"vision.html\",\n"
              "    \"/playground\": \"playground.html\",\n"
              "    \"/playground.html\": \"playground.html\",\n"
              "    \"/walk\": \"walk.html\",\n"
              "    \"/cube\": \"cube.html\",\n"
              "}",
              1,
          )
          s = s.replace(
              "def pin_xargs(template, slots, steps):",
              "def constrained_xargs():\n"
              "    \"\"\"Read over the labels only (vLLM PR #58216).\"\"\"\n"
              "    return {\"diffusion_constrained\": True} if getattr(ARGS, \"constrained\", True) else {}\n\n\n"
              "def pin_xargs(template, slots, steps):",
          )
          s = s.replace(
              "**pin_xargs(template, slots, schema[\"steps\"]),",
              "**pin_xargs(template, slots, schema[\"steps\"]),\n            **constrained_xargs(),",
          )
          s = s.replace(
              "class Handler(BaseHTTPRequestHandler):",
              "class Server(ThreadingHTTPServer):\n"
              "    request_queue_size = 256\n"
              "    daemon_threads = True\n\n\n"
              "class Handler(BaseHTTPRequestHandler):",
          )
          s = s.replace(
              "        if self.path == \"/health\":\n            return self._json(200, {\"status\": \"ok\"})",
              "        if self.path == \"/health\":\n"
              "            return self._json(200, {\"status\": \"ok\"})\n"
              "        path_clean = self.path.split(\"?\")[0]\n"
              "        if path_clean in PAGES and TEST_PAGE:\n"
              "            target_file = os.path.join(\n"
              "                os.path.dirname(os.path.abspath(__file__)), PAGES[path_clean]\n"
              "            )\n"
              "            if os.path.exists(target_file):\n"
              "                body = open(target_file, \"rb\").read()\n"
              "                self.send_response(200)\n"
              "                self.send_header(\"content-type\", \"text/html; charset=utf-8\")\n"
              "                self.send_header(\"content-length\", str(len(body)))\n"
              "                self.end_headers()\n"
              "                self.wfile.write(body)\n"
              "                return",
          )
          s = s.replace(
              "    p.add_argument(\"--host\", default=\"0.0.0.0\")",
              "    p.add_argument(\n"
              "        \"--no-constrained\",\n"
              "        dest=\"constrained\",\n"
              "        action=\"store_false\",\n"
              "        help=\"read over the whole vocabulary instead of the labels\",\n"
              "    )\n"
              "    p.add_argument(\"--host\", default=\"0.0.0.0\")",
          )
          s = s.replace(
              "ThreadingHTTPServer((host, port), Handler)", "Server((host, port), Handler)"
          ).replace(
              "ThreadingHTTPServer((ARGS.host, ARGS.port), Handler)",
              "Server((ARGS.host, ARGS.port), Handler)",
          )
          p.write_text(s)
          EOF
          python3 patch_server.py
          cat > djev-spark/patch_vllm.py << 'EOF'
          import pathlib, shutil, urllib.request

          VLLM_6591 = "6591b093b29536dd070c6af3628b734025c53e23"
          VLLM_F831 = "f831226339b87554b1de9341276e7bee7270fa8a"
          VLLM_58226 = "0436817607d5f7cae0f88f2f4e8347f9fc0b09d4"
          dg_6591 = urllib.request.urlopen(f"https://raw.githubusercontent.com/mmastrac/vllm/{VLLM_6591}/vllm/model_executor/models/diffusion_gemma.py").read().decode("utf-8")
          dg_f831 = urllib.request.urlopen(f"https://raw.githubusercontent.com/mmastrac/vllm/{VLLM_F831}/vllm/model_executor/models/diffusion_gemma.py").read().decode("utf-8")
          split_anchor = "@torch.compile(dynamic=True, backend=current_platform.simple_compile_backend)\ndef _compute_num_rejected("
          dg_head = dg_6591.split(split_anchor, 1)[0].replace("import torch\n", "import torch\nimport torch._dynamo\n", 1)
          dg_head = dg_head.replace(
              "from vllm.v1.outputs import LogprobsTensors",
              "from vllm.v1.outputs import LogprobsTensors\n"
              "from vllm.v1.sample.ops.diffusion_sampler import (\n"
              "    sample_row_stats,\n"
              "    sample_row_stats_reference,\n"
              ")",
              1,
          )
          old_cl = """    def compute_logits(self, hidden_states: torch.Tensor) -> torch.Tensor | None:
                  logits = self.logits_processor(self.lm_head, hidden_states)
                  if logits is not None and self.final_logit_softcapping is not None:
                      logits = _softcap_logits(logits, self.final_logit_softcapping)
                  return logits"""
          new_cl = """    def compute_logits(self, hidden_states: torch.Tensor) -> torch.Tensor | None:
                  states = getattr(self, "diffusion_states", None)
                  allowed = states.step_allowed if states is not None else None
                  if allowed is not None:
                      logits = torch.nn.functional.linear(
                          hidden_states, self.lm_head.weight[allowed]
                      ).float()
                      if self.final_logit_softcapping is not None:
                          logits = _softcap_logits(logits, self.final_logit_softcapping)
                      return logits
                  logits = self.logits_processor(self.lm_head, hidden_states)
                  if logits is not None and self.final_logit_softcapping is not None:
                      logits = _softcap_logits(logits, self.final_logit_softcapping)
                  return logits"""
          dg_head = dg_head.replace(old_cl, new_cl, 1)
          dg_tail = split_anchor + dg_f831.split(split_anchor, 1)[1]
          dg_tail = dg_tail.replace(
              "@torch._dynamo.config.patch(recompile_limit=64)\n@torch.compile(dynamic=True, backend=current_platform.simple_compile_backend)\ndef _compiled_sample_step(\n    # Logits from the model [num_decode * CL, vocab]\n    logits: torch.Tensor,",
              "@torch._dynamo.config.patch(recompile_limit=64)\n@torch.compile(dynamic=True, backend=current_platform.simple_compile_backend)\ndef _denoise_temperature(\n    step_tensor: torch.Tensor,\n    slots: torch.Tensor,\n    max_denoising_steps: float,\n    t_min: float,\n    t_max: float,\n) -> torch.Tensor:\n    steps_f = step_tensor[slots].float()\n    remaining = (max_denoising_steps - steps_f).clamp(min=1.0)\n    return t_min + (t_max - t_min) * (remaining / max_denoising_steps)\n\n\ndef _compiled_sample_step(\n    new_tokens: torch.Tensor,\n    argmax_tokens: torch.Tensor,\n    token_entropy: torch.Tensor,\n    probs: torch.Tensor | None,",
              1,
          )
          dg_tail = dg_tail.replace(
              "    # Scalar config\n    max_denoising_steps: float,\n    t_min: float,\n    t_max: float,\n    confidence_threshold: float,",
              "    # Scalar config\n    confidence_threshold: float,",
              1,
          )
          old_p123 = """    num_decode = decode_slots.shape[0]
              device = decode_slots.device

              # ---- Phase 1: Temperature schedule ----
              steps_f = step_tensor[decode_slots].float()
              remaining = (max_denoising_steps - steps_f).clamp(min=1.0)
              temp = t_min + (t_max - t_min) * (remaining / max_denoising_steps)

              # ---- Phase 2: Temperature scaling + Gumbel-max sampling ----
              logits_3d = logits.reshape(num_decode, CL, -1).float()
              scaled = logits_3d / temp[:, None, None].clamp(min=1e-10)

              # Gumbel-max trick: argmax(logits/T + Gumbel) ~ sample from softmax(logits/T)
              u = torch.rand_like(scaled).clamp(min=1e-20)
              gumbel = -torch.log(-torch.log(u))
              # Zero noise when temp==0 (greedy)
              noisy = scaled + gumbel * (temp[:, None, None] > 0).float()
              new_tokens = noisy.view(-1, noisy.shape[-1]).argmax(dim=-1).view(num_decode, CL)
              argmax_tokens = (
                  scaled.view(-1, scaled.shape[-1]).argmax(dim=-1).view(num_decode, CL)
              )
              if allowed is not None:
                  new_tokens = allowed[new_tokens]
                  argmax_tokens = allowed[argmax_tokens]

              # ---- Phase 3: Probs, self-conditioning, confidence ----
              log_probs = scaled.log_softmax(dim=-1)
              probs = log_probs.exp()

              token_entropy = -(probs * log_probs).sum(dim=-1)  # [num_decode, CL]"""
          new_p123 = """    num_decode = decode_slots.shape[0]
              device = decode_slots.device

              if allowed is not None:
                  new_tokens = allowed[new_tokens]
                  argmax_tokens = allowed[argmax_tokens]

              # ---- Phase 3: Confidence ----"""
          dg_tail = dg_tail.replace(old_p123, new_p123, 1)
          dg_tail = dg_tail.replace(
              "    # ---- Phase 7: Copy canvas → draft_tokens for all slots ----\n    draft_tokens[all_slots, :CL] = canvas[all_slots]\n\n    return scaled",
              "    # ---- Phase 7: Copy canvas → draft_tokens for all slots ----\n    draft_tokens[all_slots, :CL] = canvas[all_slots]",
              1,
          )
          dg_tail = dg_tail.replace(
              "budget = max(1, int(free * 0.5) // max(W * self.vocab_size * 4 * 10, 1))",
              "budget = max(1, int(free * 0.5) // max(W * self.vocab_size * 4 * 3, 1))",
              1,
          )
          old_inv = """                scaled = _compiled_sample_step(
                              tile_logits,
                              tile_slots,
                              decode_idx[sel],
                              all_slots,
                              tile_valid,
                              # State, viewed at this tile's width
                              states.canvas[:, :W],
                              states.argmax_canvas[:, :W],
                              states.step,
                              states.is_encoder_phase,
                              states.confident,
                              states.self_conditioning_embeds[:, :W],
                              embed_weight,
                              self.normalizer,
                              states.accepted_canvas_history[:, :, :W],
                              states.accepted_canvas_history_len,
                              states.max_steps,
                              states.pin_mask[:, :W],
                              states.seed_canvas[:, :W],
                              states.read_only,
                              # Output
                              sampled[:, :W],
                              num_sampled,
                              self.req_states.draft_tokens,
                              # Config
                              max_denoising_steps=float(states.max_denoising_steps),
                              t_min=self.t_min,
                              t_max=self.t_max,
                              confidence_threshold=self.confidence_threshold,"""
          new_inv = """                temp = _denoise_temperature(
                              states.step,
                              tile_slots,
                              float(states.max_denoising_steps),
                              self.t_min,
                              self.t_max,
                          )
                          probs_dtype = embed_weight.dtype if compute_sc else None
                          if tile_logits.is_cuda:
                              seed = int(torch.randint(0, 2**31 - 1, (1,)).item())
                              stats = sample_row_stats(tile_logits, temp, W, seed, probs_dtype)
                          else:
                              stats = sample_row_stats_reference(tile_logits, temp, W, probs_dtype)
                          argmax_rows, sample_rows, entropy_rows, probs_rows = stats
                          probs = probs_rows.view(n, W, -1) if probs_rows is not None else None
                          scaled = None
                          if want_logprobs:
                              scaled = tile_logits.float().view(n, W, -1) / temp[:, None, None].clamp(min=1e-10)
                          _compiled_sample_step(
                              sample_rows.view(n, W),
                              argmax_rows.view(n, W),
                              entropy_rows.view(n, W),
                              probs,
                              tile_slots,
                              decode_idx[sel],
                              all_slots,
                              tile_valid,
                              # State, viewed at this tile's width
                              states.canvas[:, :W],
                              states.argmax_canvas[:, :W],
                              states.step,
                              states.is_encoder_phase,
                              states.confident,
                              states.self_conditioning_embeds[:, :W],
                              embed_weight,
                              self.normalizer,
                              states.accepted_canvas_history[:, :, :W],
                              states.accepted_canvas_history_len,
                              states.max_steps,
                              states.pin_mask[:, :W],
                              states.seed_canvas[:, :W],
                              states.read_only,
                              # Output
                              sampled[:, :W],
                              num_sampled,
                              self.req_states.draft_tokens,
                              # Config
                              confidence_threshold=self.confidence_threshold,"""
          dg_tail = dg_tail.replace(old_inv, new_inv, 1)
          old_remove = """    def remove_request(self, req_id: str) -> None:
                  idx = self._req_id_to_index.pop(req_id, None)
                  if idx is not None:
                      self.diffusion_states.remove_request(idx)"""
          new_remove = old_remove + """\n\n    def num_draft_tokens_per_req(self, input_batch: Any) -> np.ndarray:\n        slots = input_batch.idx_mapping_np[: input_batch.num_reqs]\n        return self.diffusion_states.canvas_width_np[slots]"""
          dg_tail = dg_tail.replace(old_remove, new_remove, 1)
          dg_tail = dg_tail.replace(
              "    def add_request(self, req_idx: int, sampling_params: Any) -> None:",
              "    def add_request(self, req_idx: int, prompt_len: Any, sampling_params: Any = None) -> None:\n        if sampling_params is None:\n            sampling_params = prompt_len",
              1,
          )
          vllm_root = pathlib.Path("/usr/local/lib/python3.12/dist-packages/vllm")
          baked_vllm = pathlib.Path("/opt/dgemma/v9_baked/vllm")
          (vllm_root / "model_executor/models/diffusion_gemma.py").write_text(dg_head + dg_tail)
          (vllm_root / "v1/sample/ops").mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(f"https://raw.githubusercontent.com/mmastrac/vllm/{VLLM_58226}/vllm/v1/sample/ops/diffusion_sampler.py", vllm_root / "v1/sample/ops/diffusion_sampler.py")
          for rel in ("utils/diffusion.py", "v1/core/sched/diffusion_scheduler.py"):
              urllib.request.urlretrieve(f"https://raw.githubusercontent.com/mmastrac/vllm/{VLLM_F831}/vllm/{rel}", vllm_root / rel)
          for rel in ("model_executor/models/diffusion_gemma.py", "v1/sample/ops/diffusion_sampler.py", "utils/diffusion.py", "v1/core/sched/diffusion_scheduler.py"):
              dest = baked_vllm / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(vllm_root / rel, dest)

          p = vllm_root / "v1/worker/gpu_worker.py"
          s = p.read_text()
          if "while os.path.exists('/dev/shm/dgemma')" not in s:
              s = s.replace(
                  "        if kv_cache_memory_bytes := self.cache_config.kv_cache_memory_bytes:\n"
                  "            # still need a profile run which compiles the model for\n"
                  "            # max_num_batched_tokens\n"
                  "            self.model_runner.profile_run()",
                  "        if kv_cache_memory_bytes := self.cache_config.kv_cache_memory_bytes:\n"
                  "            if not self.model_config.enforce_eager:\n"
                  "                self.model_runner.profile_run()"
              )
              s = s.replace(
                  "        kernel_warmup(self)\n\n"
                  "        if self.use_v2_model_runner:\n"
                  "            # A workspace resize after capture frees what the graphs point at.\n"
                  "            warmup_kernels(self.model_runner, self.execute_model, self.sample_tokens)",
                  "        if not self.model_config.enforce_eager:\n"
                  "            kernel_warmup(self)\n"
                  "            if self.use_v2_model_runner:\n"
                  "                warmup_kernels(self.model_runner, self.execute_model, self.sample_tokens)"
              )
              s = s.replace(
                  "self.model_runner.load_model(load_dummy_weights=load_dummy_weights)",
                  "import os, time\n"
                  "            while os.path.exists('/dev/shm/dgemma') and not os.path.exists('/dev/shm/dgemma/.ready'): time.sleep(0.02)\n"
                  "            self.model_runner.load_model(load_dummy_weights=load_dummy_weights)"
              )
              p.write_text(s)
          EOF
          cat > djev-spark/Dockerfile.cloudrun << 'EOF'
          FROM ghcr.io/taeold/djev-run:latest
          COPY patch_vllm.py /tmp/patch_vllm.py
          RUN python3 /tmp/patch_vllm.py && rm /tmp/patch_vllm.py
          COPY server/ /opt/dgemma/
          COPY server/ /opt/dgemma/v9_baked/dgemma/
          COPY entrypoint.sh /entrypoint.sh
          RUN chmod +x /entrypoint.sh && python3 -m compileall -f -q /opt/dgemma/structured_server.py /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/diffusion_gemma.py /usr/local/lib/python3.12/dist-packages/vllm/v1/sample/ops/diffusion_sampler.py /usr/local/lib/python3.12/dist-packages/vllm/utils/diffusion.py /usr/local/lib/python3.12/dist-packages/vllm/v1/core/sched/diffusion_scheduler.py
          EXPOSE 8080
          ENTRYPOINT ["/entrypoint.sh"]
          EOF

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ghcr.io/taeold/djev-run:latest
        uses: docker/build-push-action@v6
        with:
          context: ./djev-spark
          file: ./djev-spark/Dockerfile.cloudrun
          platforms: linux/amd64
          push: true
          tags: ghcr.io/taeold/djev-run:latest
