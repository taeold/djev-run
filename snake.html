<html lang="en">

<title>djev / snake</title>

<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">djev <span class="brand-sep">/</span> snake</span>
      <span class="status-line">
        <span id="dot" class="dot"></span>
        <span id="status-text">Idle · ready</span>
      </span>
    </div>
    <div class="toolbar">
      <button id="btn-config" class="ghost" type="button">Endpoint</button>
      <button id="btn-theme" class="ghost" type="button">Theme</button>
      <button id="btn-start" class="primary" type="button">Start</button>
      <button id="btn-step" type="button">Step</button>
      <button id="btn-reset" type="button">Reset</button>
    </div>
  </header>

  <div id="config-drawer" class="config-drawer" hidden>
    <label>
      URL
      <input id="endpoint" type="text" style="width: 320px" placeholder="/v1/systemone or https://...run.app">
    </label>
    <label>
      Bearer Token
      <input id="token" type="password" style="width: 180px" placeholder="optional API_KEY">
    </label>
  </div>

  <main class="workspace">
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div class="board-caption">
        <span id="coords-text">head [5, 6] · food [9, 3]</span>
        <span>space: play/pause · r: reset</span>
      </div>
    </div>

    <div class="readout">
      <div class="metrics-row">
        <div>
          <div class="metric-label">Score</div>
          <div id="m-score" class="metric-value">0</div>
        </div>
        <div>
          <div class="metric-label">Step</div>
          <div id="m-steps" class="metric-value">0</div>
        </div>
        <div>
          <div class="metric-label">Latency</div>
          <div class="metric-value"><span id="m-ms">0</span><span class="metric-unit">ms</span></div>
        </div>
      </div>

      <div class="section-head">
        <span class="section-title">POST /v1/systemone probabilities</span>
        <label class="mask-toggle">
          <input id="chk-mask" type="checkbox" checked>
          <span>safe mask</span>
        </label>
      </div>

      <div class="prob-table">
        <div class="prob-row">
          <div class="dir-cell" id="name-up"><span class="dir-arrow">↑</span><span>up</span></div>
          <div class="meter-track"><div class="meter-fill" id="bar-up"></div></div>
          <div class="pct-cell muted" id="val-up">25.0%</div>
          <div class="safety-cell" id="safe-up">safe</div>
        </div>
        <div class="prob-row">
          <div class="dir-cell" id="name-down"><span class="dir-arrow">↓</span><span>down</span></div>
          <div class="meter-track"><div class="meter-fill" id="bar-down"></div></div>
          <div class="pct-cell muted" id="val-down">25.0%</div>
          <div class="safety-cell" id="safe-down">safe</div>
        </div>
        <div class="prob-row">
          <div class="dir-cell" id="name-left"><span class="dir-arrow">←</span><span>left</span></div>
          <div class="meter-track"><div class="meter-fill" id="bar-left"></div></div>
          <div class="pct-cell muted" id="val-left">0.0%</div>
          <div class="safety-cell blocked" id="safe-left">neck</div>
        </div>
        <div class="prob-row">
          <div class="dir-cell active" id="name-right"><span class="dir-arrow">→</span><span>right</span></div>
          <div class="meter-track"><div class="meter-fill active" id="bar-right"></div></div>
          <div class="pct-cell" id="val-right">50.0%</div>
          <div class="safety-cell" id="safe-right">safe</div>
        </div>
      </div>

      <details class="inspector">
        <summary>▸ Inspect live state and response JSON</summary>
        <pre id="payload-view"></pre>
      </details>
    </div>
  </main>
</div>

<script>
const GRID = 12;
const CSS_SIZE = 400;
const DIRS = ["up", "down", "left", "right"];
const VEC = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0]
};

const QUESTIONS_SCHEMA = {
  move: {
    type: "choice",
    instructions: "Select the next move for the snake head. Choose a direction in safe_moves that reduces manhattan_to_food while preserving open_space.",
    criteria: {
      up: "Move north (y - 1)",
      down: "Move south (y + 1)",
      left: "Move west (x - 1)",
      right: "Move east (x + 1)"
    }
  }
};

const $ = id => document.getElementById(id);

function defaultEndpoint() {
  try {
    const saved = localStorage.getItem("djev_snake_endpoint");
    if (saved) return saved;
  } catch (e) {}
  if (location.protocol === "http:" || location.protocol === "https:") {
    return "/v1/systemone";
  }
  return "https://djev-dgemma-864751976003.us-central1.run.app/v1/systemone";
}

$("endpoint").value = defaultEndpoint();
try {
  $("token").value = localStorage.getItem("djev_api_key") || "";
} catch (e) {}

$("endpoint").onchange = () => {
  try { localStorage.setItem("djev_snake_endpoint", $("endpoint").value.trim()); } catch (e) {}
};
$("token").onchange = () => {
  try { localStorage.setItem("djev_api_key", $("token").value.trim()); } catch (e) {}
};

$("btn-config").onclick = () => {
  const dr = $("config-drawer");
  dr.hidden = !dr.hidden;
};

$("btn-theme").onclick = () => {
  const root = document.documentElement;
  const isDark = root.classList.contains("dark") ||
    (!root.classList.contains("light") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.classList.toggle("dark", !isDark);
  root.classList.toggle("light", isDark);
  drawBoard();
};

function resolveEndpointUrl() {
  let u = $("endpoint").value.trim() || "/v1/systemone";
  if (u.startsWith("http://") || u.startsWith("https://")) {
    if (!u.endsWith("/v1/systemone") && !u.endsWith("/v1/evaluate")) {
      u = u.replace(/\/+$/, "") + "/v1/systemone";
    }
  }
  return u;
}

let snake = [];
let direction = "right";
let nextChoice = "right";
let food = [9, 3];
let score = 0;
let steps = 0;
let alive = true;
let running = false;
let inflight = false;
let sandboxFallback = false;

function spawnFood(body) {
  const occupied = new Set(body.map(([x, y]) => x + "," + y));
  const free = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if (!occupied.has(x + "," + y)) free.push([x, y]);
    }
  }
  if (!free.length) return [0, 0];
  const idx = (steps * 17 + score * 31 + 7) % free.length;
  return free[idx];
}

function floodFillCount(startX, startY, bodySet) {
  const startKey = startX + "," + startY;
  if (startX < 0 || startX >= GRID || startY < 0 || startY >= GRID || bodySet.has(startKey)) {
    return 0;
  }
  const visited = new Set([startKey]);
  const queue = [[startX, startY]];
  while (queue.length > 0) {
    const [cx, cy] = queue.shift();
    for (const d of DIRS) {
      const [vx, vy] = VEC[d];
      const nx = cx + vx, ny = cy + vy;
      const k = nx + "," + ny;
      if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID && !bodySet.has(k) && !visited.has(k)) {
        visited.add(k);
        queue.push([nx, ny]);
      }
    }
  }
  return visited.size;
}

function buildState() {
  const [hx, hy] = snake[0];
  const [fx, fy] = food;
  const dx = fx - hx;
  const dy = fy - hy;
  const bodyObstacles = new Set(snake.slice(0, -1).map(([x, y]) => x + "," + y));
  const [nxNeck, nyNeck] = snake[1] || [-1, -1];

  const safeMoves = [];
  const blockedMoves = {};
  const moveAnalysis = {};

  for (const d of DIRS) {
    const [vx, vy] = VEC[d];
    const tx = hx + vx;
    const ty = hy + vy;
    let reason = "safe";
    if (tx === nxNeck && ty === nyNeck) {
      reason = "neck";
    } else if (tx < 0 || tx >= GRID || ty < 0 || ty >= GRID) {
      reason = "wall";
    } else if (bodyObstacles.has(tx + "," + ty)) {
      reason = "body";
    }
    const isSafe = reason === "safe";
    const dist = Math.abs(fx - tx) + Math.abs(fy - ty);
    const space = isSafe ? floodFillCount(tx, ty, bodyObstacles) : 0;
    if (isSafe) {
      safeMoves.push(d);
    } else {
      blockedMoves[d] = reason;
    }
    moveAnalysis[d] = {
      safe: isSafe,
      reason,
      manhattan_to_food: dist,
      open_space: space,
      reduces_distance: dist < (Math.abs(dx) + Math.abs(dy))
    };
  }

  let bestMove = safeMoves[0] || direction;
  let bestScore = -1e9;
  for (const d of safeMoves) {
    const info = moveAnalysis[d];
    const s = info.open_space * 2 - info.manhattan_to_food * 5 + (d === direction ? 0.5 : 0);
    if (s > bestScore) {
      bestScore = s;
      bestMove = d;
    }
  }

  return {
    board: `${GRID}x${GRID}`,
    head: [hx, hy],
    direction,
    length: snake.length,
    score,
    food: [fx, fy],
    food_delta: {
      dx,
      dy,
      manhattan: Math.abs(dx) + Math.abs(dy),
      preferred_horizontal: dx > 0 ? "right" : (dx < 0 ? "left" : "aligned"),
      preferred_vertical: dy > 0 ? "down" : (dy < 0 ? "up" : "aligned")
    },
    safe_moves: safeMoves,
    blocked_moves: blockedMoves,
    move_analysis: moveAnalysis,
    recommended_safe_move: bestMove
  };
}

function simulateSystemOne(state) {
  const logits = {};
  for (const d of DIRS) {
    const info = state.move_analysis[d];
    if (!info.safe) {
      logits[d] = -4.5;
    } else {
      let l = 1.1;
      if (info.reduces_distance) l += 1.7;
      l += Math.min(info.open_space, 60) * 0.025;
      if (d === state.recommended_safe_move) l += 1.0;
      logits[d] = l;
    }
  }
  const mx = Math.max(...Object.values(logits));
  const exps = {};
  let sum = 0;
  for (const d of DIRS) {
    exps[d] = Math.exp(logits[d] - mx);
    sum += exps[d];
  }
  const probs = {};
  let bestDir = "right", bestP = -1;
  for (const d of DIRS) {
    probs[d] = exps[d] / sum;
    if (probs[d] > bestP) {
      bestP = probs[d];
      bestDir = d;
    }
  }
  return {
    model: "dgemma-sandbox",
    answers: {
      move: {
        type: "choice",
        choice: bestDir,
        probabilities: probs,
        confidence: bestP
      }
    },
    diagnostics: {
      mode: "sandbox_fallback",
      timing: { reads: 1, total_ms: 12.0 }
    }
  };
}

async function requestDecision(state) {
  const reqBody = {
    model: "jev-latest",
    samples: 1,
    steps: 1,
    seed: 42 + steps,
    state,
    questions: QUESTIONS_SCHEMA
  };
  const headers = { "content-type": "application/json" };
  const tok = $("token").value.trim();
  if (tok) headers["authorization"] = "Bearer " + tok;

  const t0 = performance.now();
  try {
    const resp = await fetch(resolveEndpointUrl(), {
      method: "POST",
      headers,
      body: JSON.stringify(reqBody)
    });
    const ms = Math.round(performance.now() - t0);
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error((data.error && data.error.message) || ("HTTP " + resp.status));
    }
    sandboxFallback = false;
    return { reqBody, data, ms };
  } catch (err) {
    const ms = Math.max(9, Math.round(performance.now() - t0));
    sandboxFallback = true;
    const data = simulateSystemOne(state);
    return { reqBody, data, ms };
  }
}

function setStatus(text, kind) {
  $("status-text").textContent = text;
  $("dot").className = "dot" + (kind ? " " + kind : "");
}

function updateUI(state, probs, finalChoice, ms) {
  $("m-score").textContent = String(score);
  $("m-steps").textContent = String(steps);
  $("m-ms").textContent = String(ms);

  const [hx, hy] = state.head;
  const [fx, fy] = state.food;
  $("coords-text").textContent = `head [${hx}, ${hy}] · food [${fx}, ${fy}]`;

  for (const d of DIRS) {
    const p = Math.max(0, Math.min(1, Number(probs[d] || 0)));
    const pct = (p * 100).toFixed(1) + "%";
    const info = state.move_analysis[d];
    const isSelected = d === finalChoice;

    $("name-" + d).className = "dir-cell" + (isSelected ? " active" : "");
    $("val-" + d).className = "pct-cell" + (isSelected ? "" : " muted");
    $("val-" + d).textContent = pct;

    const safeEl = $("safe-" + d);
    safeEl.textContent = info.safe ? "safe" : info.reason;
    safeEl.className = "safety-cell" + (info.safe ? "" : " blocked");

    const barEl = $("bar-" + d);
    barEl.style.width = (p * 100).toFixed(1) + "%";
    barEl.className = "meter-fill" + (isSelected ? (info.safe ? " active" : " danger") : "");
  }
}

function drawBoard() {
  const canvas = $("board");
  const dpr = window.devicePixelRatio || 1;
  const targetW = Math.round(CSS_SIZE * dpr);
  if (canvas.width !== targetW || canvas.height !== targetW) {
    canvas.width = targetW;
    canvas.height = targetW;
  }
  const ctx = canvas.getContext("2d");
  ctx.save();
  ctx.scale(dpr, dpr);

  const W = CSS_SIZE;
  const H = CSS_SIZE;
  const cell = W / GRID;
  const styles = getComputedStyle(document.documentElement);
  const bg = styles.getPropertyValue("--board-bg").trim() || "#0d1117";
  const dotCol = styles.getPropertyValue("--board-dot").trim() || "#30363d";
  const gridCol = styles.getPropertyValue("--board-grid").trim() || "#161b22";
  const headCol = styles.getPropertyValue("--snake-head").trim() || "#2f81f7";
  const bodyCol = styles.getPropertyValue("--snake-body").trim() || "#1f6feb";
  const foodCol = styles.getPropertyValue("--ok").trim() || "#3fb950";
  const accentCol = styles.getPropertyValue("--accent").trim() || "#2f81f7";

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle hairline grid + intersection dot matrix
  ctx.strokeStyle = gridCol;
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    const p = Math.floor(i * cell) + 0.5;
    ctx.beginPath();
    ctx.moveTo(p, 0);
    ctx.lineTo(p, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, p);
    ctx.lineTo(W, p);
    ctx.stroke();
  }
  ctx.fillStyle = dotCol;
  for (let y = 1; y < GRID; y++) {
    for (let x = 1; x < GRID; x++) {
      ctx.beginPath();
      ctx.arc(x * cell, y * cell, 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Ghost vector line from head toward chosen next cell
  if (snake.length > 0 && alive && nextChoice) {
    const [hx, hy] = snake[0];
    const [vx, vy] = VEC[nextChoice] || [0, 0];
    const cx = (hx + 0.5) * cell;
    const cy = (hy + 0.5) * cell;
    const tx = (hx + vx + 0.5) * cell;
    const ty = (hy + vy + 0.5) * cell;
    ctx.strokeStyle = accentCol;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1.0;
  }

  // Target food with crisp subtle ring
  const [fx, fy] = food;
  const fcx = (fx + 0.5) * cell;
  const fcy = (fy + 0.5) * cell;
  ctx.strokeStyle = foodCol;
  ctx.globalAlpha = 0.25;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(fcx, fcy, cell * 0.36, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 1.0;
  ctx.fillStyle = foodCol;
  ctx.beginPath();
  ctx.arc(fcx, fcy, cell * 0.24, 0, Math.PI * 2);
  ctx.fill();

  // Snake body segments
  for (let i = snake.length - 1; i >= 0; i--) {
    const [sx, sy] = snake[i];
    const isHead = i === 0;
    ctx.fillStyle = isHead ? headCol : bodyCol;
    ctx.globalAlpha = isHead ? 1.0 : Math.max(0.42, 0.9 - (i / (snake.length + 5)) * 0.48);
    const pad = isHead ? cell * 0.09 : cell * 0.14;
    const radius = isHead ? 6 : 4;
    ctx.beginPath();
    ctx.roundRect(sx * cell + pad, sy * cell + pad, cell - pad * 2, cell - pad * 2, radius);
    ctx.fill();

    // Head direction indicator dots
    if (isHead) {
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = "#ffffff";
      const [vx, vy] = VEC[direction] || [1, 0];
      const hcx = (sx + 0.5) * cell;
      const hcy = (sy + 0.5) * cell;
      const fwd = cell * 0.17;
      const side = cell * 0.13;
      const px = -vy, py = vx;
      ctx.beginPath();
      ctx.arc(hcx + vx * fwd + px * side, hcy + vy * fwd + py * side, 1.8, 0, Math.PI * 2);
      ctx.arc(hcx + vx * fwd - px * side, hcy + vy * fwd - py * side, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function applyMove(chosenDir) {
  const [hx, hy] = snake[0];
  const [vx, vy] = VEC[chosenDir];
  const nx = hx + vx;
  const ny = hy + vy;
  const bodyObstacles = new Set(snake.slice(0, -1).map(([x, y]) => x + "," + y));

  if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID || bodyObstacles.has(nx + "," + ny)) {
    alive = false;
    running = false;
    $("btn-start").textContent = "Start";
    setStatus(`Collision on ${chosenDir}`, "err");
    drawBoard();
    return;
  }

  snake.unshift([nx, ny]);
  direction = chosenDir;
  if (nx === food[0] && ny === food[1]) {
    score += 1;
    food = spawnFood(snake);
  } else {
    snake.pop();
  }
  steps += 1;
}

function resetGame() {
  running = false;
  $("btn-start").textContent = "Start";
  snake = [[5, 6], [4, 6], [3, 6], [2, 6]];
  direction = "right";
  nextChoice = "right";
  score = 0;
  steps = 0;
  alive = true;
  food = spawnFood(snake);
  setStatus("Idle · ready", "");
  const st = buildState();
  updateUI(st, { up: 0.25, down: 0.25, left: 0.0, right: 0.50 }, "right", 0);
  $("payload-view").textContent = JSON.stringify(
    { state: st, questions: QUESTIONS_SCHEMA },
    null,
    2
  );
  drawBoard();
}

async function stepOnce() {
  if (inflight || !alive) return;
  inflight = true;
  const state = buildState();
  const { reqBody, data, ms } = await requestDecision(state);
  const moveAns = (data.answers && data.answers.move) || {};
  const probs = moveAns.probabilities || { up: 0.25, down: 0.25, left: 0.25, right: 0.25 };
  const rawChoice = moveAns.choice || DIRS.reduce((a, b) => (probs[a] >= probs[b] ? a : b));

  let finalChoice = rawChoice;
  if ($("chk-mask").checked && state.safe_moves.length > 0) {
    if (!state.safe_moves.includes(rawChoice)) {
      finalChoice = state.safe_moves.reduce((a, b) => ((probs[a] || 0) >= (probs[b] || 0) ? a : b));
    }
  }
  nextChoice = finalChoice;

  $("payload-view").textContent = JSON.stringify(
    { request: reqBody, response: data },
    null,
    2
  );

  applyMove(finalChoice);
  if (alive) {
    if (sandboxFallback) {
      setStatus(`Simulated · ${ms} ms`, "warn");
    } else {
      setStatus(`Live · ${data.model || "dgemma"} · ${ms} ms`, "live");
    }
  }
  updateUI(state, probs, finalChoice, ms);
  drawBoard();
  inflight = false;
}

async function loop() {
  while (running && alive) {
    const tStart = performance.now();
    await stepOnce();
    if (!running || !alive) break;
    const elapsed = performance.now() - tStart;
    const wait = Math.max(16, 65 - elapsed);
    await new Promise(r => setTimeout(r, wait));
  }
}

$("btn-start").onclick = () => {
  if (!alive) resetGame();
  running = !running;
  $("btn-start").textContent = running ? "Pause" : "Start";
  if (running) {
    loop();
  } else {
    setStatus("Paused", "");
  }
};

$("btn-step").onclick = async () => {
  if (!alive) resetGame();
  running = false;
  $("btn-start").textContent = "Start";
  await stepOnce();
};

$("btn-reset").onclick = () => resetGame();

window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") {
    e.preventDefault();
    $("btn-start").click();
  } else if (e.key === "r" || e.key === "R") {
    e.preventDefault();
    resetGame();
  }
});

new MutationObserver(() => drawBoard()).observe(document.documentElement, {
  attributes: true,
  attributeFilter: ["class"]
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawBoard());

resetGame();
</script>
</body>
</html>
